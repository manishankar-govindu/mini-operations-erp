# Optional: runs PostgreSQL locally. The app itself reads DB settings from environment variables,
# so it can point at any PostgreSQL host (RDS, Supabase, Neon, Azure, etc.) by changing backend/.env.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mini_erp
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
